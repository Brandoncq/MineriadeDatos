version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://localhost:3000"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: "http://localhost:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      FRONTEND_URL: "http://frontend:5173"
      MODEL_URL: "http://model:5000"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: unless-stopped

  model:
    build: ./model
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000

      BACKEND_URL: "http://backend:3000"

    restart: unless-stopped
