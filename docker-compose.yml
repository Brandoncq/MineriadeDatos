version: '3.8'

services:
  # -------------------------------------------------------
  # 1. FRONTEND (React + Nginx)
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # El navegador del usuario necesita saber dónde está la API pública
        VITE_BACKEND_URL: "https://api.chavezdev.com" 
    restart: always
    networks:
      - red-interna

  # -------------------------------------------------------
  # 2. BACKEND (Node.js)
  # -------------------------------------------------------
  backend:
    build: ./backend
    environment:
      # El backend habla con el modelo INTERNAMENTE (nombre del servicio:puerto)
      MODEL_URL: "http://model:5000"
      # Para CORS, le decimos quién puede pedirle datos
      FRONTEND_URL: "https://app.chavezdev.com"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: always
    networks:
      - red-interna

  # -------------------------------------------------------
  # 3. MODEL (Python FastAPI)
  # -------------------------------------------------------
  model:
    build: ./model
    environment:
      # El modelo solo necesita saber quién lo llama (opcional si usas CORS en Python)
      BACKEND_URL: "http://backend:3000"
    restart: always
    networks:
      - red-interna

  # -------------------------------------------------------
  # 4. CLOUDFLARE TUNNEL (El reemplazo de Nginx público)
  # -------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --token ${TUNNEL_TOKEN}
    networks:
      - red-interna

# Definimos una red privada para que se vean entre ellos
networks:
  red-interna:
    driver: bridge

