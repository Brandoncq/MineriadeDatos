services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://backend:3000"
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: "http://backend:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      FRONTEND_URL: "http://frontend:5173"
      MODEL_URL: "http://model:5000"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: unless-stopped

  model:
    build: ./model
    ports:
      - "5000:5000"
    environment:
      BACKEND_URL: "http://backend:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - model
