services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://64.225.126.210:3000"
    ports:
    - "5173:5173"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      MODEL_URL: "http://64.225.126.210:5000"
      FRONTEND_URL: "http://64.225.126.210:9090"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: unless-stopped

  model:
    build: ./model
    ports:
      - "5000:5000"
    environment:
      BACKEND_URL: "http://64.225.126.210:3000"
    restart: unless-stopped 

