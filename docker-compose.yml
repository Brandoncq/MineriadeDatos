services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://backend:3000"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MODEL_URL: "http://model:5000"
      FRONTEND_URL: "http://frontend:80"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: unless-stopped

  model:
    build: ./model
    environment:
      BACKEND_URL: "http://backend:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"    # ⬅️  CAMBIADO
      - "8443:443"   # ⬅️  CAMBIADO
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - model
