services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: "http://backend.predict.work.gd"
    ports:
    - "5173:5173"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MODEL_URL: "model.predict.work.gd"
      FRONTEND_URL: "http://predict.work.gd"
      PORT: 3000
      NODE_ENV: "production"
    depends_on:
      - model
    restart: unless-stopped

  model:
    build: ./model
    environment:
      BACKEND_URL: "http://backend.predict.work.gd"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "9090:80"   # ⬅️  CAMBIADO
      - "8443:443"   # ⬅️  CAMBIADO
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - model
