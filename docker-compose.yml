version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - model

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - model
    environment:
      MODEL_URL: "http://model:5000" # puerto de Flask

  model:
    build: ./model
    ports:
      - "5000:5000" # Flask usa 5000 por defecto
    environment:
      FLASK_APP: app.py # tu archivo principal de Flask
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
